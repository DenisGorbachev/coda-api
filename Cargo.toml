[workspace]
resolver = "3"

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.88.0"
license = "Apache-2.0 OR MIT"
homepage = "https://github.com/DenisGorbachev/coda-api"
repository = "https://github.com/DenisGorbachev/coda-api"
keywords = []
categories = []
exclude = [
    ".*",
    "*.local.*",
    "doc/dev",
    "specs",
    "AGENTS.ts",
    "CargoMetadata.ts",
    "README.ts",
    "AGENTS*.md",
    "CLAUDE*.md",
    "deno.lock",
    "deno.json",
    "commitlint.config.mjs",
    "fnox.toml",
    "mise.toml",
    "rumdl.toml",
    "rustfmt.toml",
    ".yolobox"
]

[workspace.metadata.details]
name = "coda-api"
title = "Coda API client"
readme = { }

[workspace.lints.rust]
redundant_imports = "deny"
unused_import_braces = "deny"
# unused_qualifications must not be "deny" because our code style has multiple `use Foo::*;`, and some macros (derive_more::Display, strum::Display, strum::EnumString) produce code with full qualifications
# unused_qualifications = "deny"

[workspace.lints.clippy]
absolute_paths = "deny"
arithmetic_side_effects = "deny"

[package]
name = "coda-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "A Coda API client."
license.workspace = true
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
exclude.workspace = true

[package.metadata.details]
title = "Coda API client"

[lints]
workspace = true

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["serde"] }
derive_more = { version = "2.0", features = ["display"] }
errgonomic = "0.5.0"
futures-util = "0.3.32"
governor = { version = "0.10" }
# progenitor-client version must be pinned
progenitor-client = { version = "0.14.0" }
regress = "0.10"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "stream", "default-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
time = { version = "0.3", features = ["parsing"], optional = true }
tokio = { version = "1.46", features = ["time"] }
uuid = { version = "1.0", features = ["serde", "v4"] }

[dev-dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
tokio = { version = "1.46", features = ["macros", "fs", "net", "rt", "rt-multi-thread"] }
